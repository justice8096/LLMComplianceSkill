# Keeps the build tooling and the SHA-pinned GitHub Actions up to date.
# Dependabot rewrites pinned action SHAs and keeps the "# vX" comment in step.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tooling
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-js:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Syntax-check all JavaScript files
        run: |
          find . -name "*.js" -not -path "./.git/*" -not -path "./docs/*" | sort | while read -r f; do
            echo "Checking: $f"
            node --check "$f" || exit 1
          done

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Install build tooling from lockfile without running install scripts
        run: npm ci --prefix tooling --ignore-scripts

      - name: Audit for high-severity advisories
        run: npm audit --prefix tooling --audit-level=high

      - name: Root package.json must stay dependency-free
        run: |
          node -e "const p=require('./package.json'); if (p.dependencies||p.devDependencies) { console.error('Add build dependencies to tooling/package.json, not the root: installing the plugin downloads root dependencies.'); process.exit(1); }"

      - name: Build still runs from the tooling folder
        run: npm run validate

  kb-sync-check:
    name: Regulation files match the knowledge base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: skill

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: justice8096/ai-regulatory-knowledge-base
          path: kb
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Fail if the bundled regulation files drifted from the knowledge base
        working-directory: skill
        run: node tools/sync-kb.js --check --from ../kb

name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint-js:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Syntax-check all JavaScript files
        run: |
          find . -name "*.js" -not -path "./.git/*" -not -path "./docs/*" | sort | while read -r f; do
            echo "Checking: $f"
            node --check "$f" || exit 1
          done

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Install build tooling from lockfile without running install scripts
        run: npm ci --prefix tooling --ignore-scripts

      - name: Audit for moderate-or-worse advisories
        run: npm audit --prefix tooling --audit-level=moderate

      - name: Root package.json must stay dependency-free
        run: |
          node -e "const p=require('./package.json'); if (p.dependencies||p.devDependencies) { console.error('Add build dependencies to tooling/package.json, not the root: installing the plugin downloads root dependencies.'); process.exit(1); }"

      - name: Build still runs from the tooling folder
        run: npm run validate

  kb-sync-check:
    name: Regulation files match the knowledge base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          path: skill

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: justice8096/ai-regulatory-knowledge-base
          path: kb
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Fail if the bundled regulation files drifted from the knowledge base
        working-directory: skill
        run: node tools/sync-kb.js --check --from ../kb

  unit-tests:
    name: Unit tests and SBOM check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      # Tests use Node built-ins and git only, so nothing is installed.
      - name: Run the test suite
        run: npm test

      - name: sbom.json matches package.json and the tooling lockfile
        run: npm run sbom:check

  release-provenance:
    name: Build provenance attestation
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-js, dependency-audit, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Install build tooling from lockfile without running install scripts
        run: npm run setup

      - name: Build every distribution format
        run: npm run build

      - name: Attest the built files and the SBOM
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: |
            dist/**
            sbom.json

name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint-js:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Syntax-check all JavaScript files
        run: |
          git ls-files -- '*.js' | while read -r f; do
            echo "Checking: $f"
            node --check "$f" || exit 1
          done

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Install build tooling from lockfile without running install scripts
        run: npm ci --prefix tooling --ignore-scripts

      - name: Audit for moderate-or-worse advisories
        run: npm audit --prefix tooling --audit-level=moderate

      - name: Plugin root has no package manifest or lockfile
        run: |
          for f in package.json package-lock.json npm-shrinkwrap.json yarn.lock pnpm-lock.yaml bun.lockb bun.lock bunfig.toml .npmrc; do
            if [ -e "$f" ]; then
              echo "$f is in the plugin root. Claude Code would run an install there when the plugin is installed. Put scripts and tooling in tooling/ instead."
              exit 1
            fi
          done
      - name: Build still runs from the tooling folder
        run: npm --prefix tooling run validate

  kb-sync-check:
    name: Regulation files match the knowledge base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          path: skill

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: justice8096/ai-regulatory-knowledge-base
          path: kb
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Fail if the bundled regulation files drifted from the knowledge base
        working-directory: skill
        run: node tools/sync-kb.js --check --from ../kb

  unit-tests:
    name: Unit tests and SBOM check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      # Tests use Node built-ins and git only, so nothing is installed.
      - name: Run the test suite
        run: npm --prefix tooling test

      - name: sbom.json matches tooling/package.json and its lockfile
        run: npm --prefix tooling run sbom:check

  release-provenance:
    name: Build provenance attestation
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-js, dependency-audit, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.18.0'

      - name: Install build tooling from lockfile without running install scripts
        run: npm ci --prefix tooling --ignore-scripts

      - name: Build every distribution format
        run: npm --prefix tooling run build

      - name: Attest the built files and the SBOM
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: |
            dist/**
            sbom.json
